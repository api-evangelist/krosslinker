aid: krosslinker
name: Krosslinker
description: Krosslinker (KrossLinker) is a Singapore-based deep-tech advanced-materials
  company that designs and manufactures silica aerogels — among the most insulating
  solids known — using a proprietary, water-based and scalable chemistry and manufacturing
  platform the company calls Aspire. Its product line spans Cryar super-insulating
  aerogel composite board, QuintAero ultra-light silica aerogel powder, KrossShield
  SR Pro aerogel-powered cooling paint, and a flexible aerogel blanket in development,
  serving cold-chain pharma and food packaging, building and construction passive
  cooling, and industrial insulation. Krosslinker operates from CleanTech III in Singapore
  and is a 500 Global portfolio company. It is a physical-materials manufacturer and
  publishes no public API, developer portal, or machine-readable API artifacts; this
  profile captures its public web, product, and security posture for the API Evangelist
  network.
